# Lock screen.
#
# Colours are the same palette as the bar and the Mac's sketchybar
# (dots/Darwin/config/sketchybar/colors.sh), so a locked screen looks like the
# rest of the desktop.
#
# hyprlock is already installed; what was missing was any config for it and
# anything to trigger it -- see hypridle.conf for the sleep/idle wiring.

$black = rgb(151A22)
$white = rgb(FAFAFA)
$grey = rgb(8991A2)
$dgrey = rgb(3F4965)
$red = rgb(DF6E6F)
$yellow = rgb(FECC71)
$orange = rgb(FEA361)
$green = rgb(7EBDAC)

general {
    hide_cursor = true
    # 2 = auto (match the output's fractional scale; this display runs at 1.6).
    fractional_scaling = 2
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 1.5, easeOut
}

background {
    monitor =
    # Absolute path on purpose: hyprlang does not expand $HOME here.
    path = /home/johann/.wallpapers/no-mans-sky-lock.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.75
    contrast = 1.0
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = $white
    font_size = 72
    font_family = Inter Semibold
    position = 0, 170
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Date, matching the bar's format (locale pinned so it is not Dutch)
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%a %d. %b"
    color = $grey
    font_size = 20
    font_family = Inter
    position = 0, 100
    halign = center
    valign = center
}

# Who is logged in
label {
    monitor =
    text = $USER
    color = $grey
    font_size = 14
    font_family = Inter
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = $dgrey
    inner_color = $black
    font_color = $white
    check_color = $yellow
    fail_color = $red
    capslock_color = $orange
    numlock_color = $dgrey
    bothlock_color = $orange
    invert_numlock = false
    swap_font_color = false
    font_family = Inter
    placeholder_text = <span foreground="##8991A2">Password</span>
    fail_text = <span foreground="##DF6E6F">$FAIL ($ATTEMPTS)</span>
    rounding = 8
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
