# Idle and sleep handling.
#
# This is the piece that was missing: hyprlock was installed but nothing ever
# started it, so suspending and resuming went straight back to the desktop.
# hypridle listens for logind's Lock signal and for the sleep signal, and runs
# hyprlock in response.

general {
    # pidof guard: without it, repeated lock triggers stack up hyprlock
    # instances on top of each other.
    lock_cmd = pidof hyprlock || hyprlock

    # The important one -- lock *before* the machine suspends or hibernates, so
    # resuming asks for the password. logind emits this for lid-close suspends
    # too, and for the bar's Suspend/Hibernate menu items.
    before_sleep_cmd = loginctl lock-session

    # Respect idle inhibitors, so a fullscreen video does not get locked over.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Lock after 10 minutes of inactivity.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Deliberately no dpms listener here. Turning the display off on idle needs a
# `hyprctl dispatch dpms off`, and with a lua config Hyprland evaluates dispatch
# strings as lua -- the classic form is rejected, and hl.dsp.dpms silently
# accepts any argument shape without validating it, so a wrong guess would leave
# the screen off with no reliable way to bring it back. misc.mouse_move_enables_dpms
# and key_press_enables_dpms are already set in hyprland.lua if you add one.
