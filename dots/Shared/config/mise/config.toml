# dotfiles.root (the repo's dots/ directory) is set per machine in config.local.toml;
# the per-OS groups live in config.macos.toml and config.linux.toml, loaded through auto_env in miserc.toml.
# Every top-level name needs an entry: anything the walk reaches without one is linked without a leading dot.
[dotfile_groups.shared]
root = "Shared"
exclude = [".DS_Store"]

[dotfile_groups.shared.entries]
"~/.claude" = { source = "claude" }
"~/.config" = { source = "config" }
"~/.emacs.d" = { source = "emacs.d" }
"~/.formatter" = { source = "formatter" }
"~/.ghci" = { source = "ghci" }
"~/.git-templates" = { source = "git-templates" }
"~/.gvimrc" = { source = "gvimrc" }
"~/.local" = { source = "local" }
"~/.ssh" = { source = "ssh" }
"~/.vim" = { source = "vim" }
"~/.vimrc" = { source = "vimrc" }
"~/.wallpapers" = { source = "wallpapers" }
"~/.zshrc" = { source = "zshrc" }
