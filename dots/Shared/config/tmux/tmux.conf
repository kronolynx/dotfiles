#################
#  TMUX CONFIG  #
#################

# set prefix
bind-key           C-b
# set-option -g prefix C-space
# bind-key             C-a send-prefix


#############
#  OPTIONS  #
#############

## suggested by neovim
set-option -g focus-events on

# # use vi keys
set-option -gw mode-keys vi

# set bigger history limit
set-option -g history-limit 1000000

# so you don't end up with window numbers like: 0 1 4 5 6
set-option -g renumber-windows on

# don't exit from tmux when closing a session
set -g detach-on-destroy off

# mouse support
set-option -g mouse on

# set title
set-option -g set-titles        on
set-option -g set-titles-string '#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}} - #{pane_current_command}'

# ==================
# {n}vim compability
# set -g default-terminal "$TERM"
# set -ag  terminal-features ",$TERM:RGB"
set-option -g default-terminal "tmux-256color" # if infocmp tmux-256color gives output use this, otherwise use screen-256color
set -ag  terminal-features ",tmux-256color:RGB"
set -as  terminal-features ",*:hyperlinks"
# if undercurl doesn't work check `infocmp -l -x | grep Smulx`
# set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# style of function key sequences
set-window-option -g xterm-keys on

# start window numbers from 1
set-option -g base-index 1

# set escape time so vim is responsive inside tmux
set-option -g escape-time 1


# wrap search
set-option -g wrap-search on

# repeat time
set-option -g repeat-time 700

set-option -g automatic-rename on

set-option -g automatic-rename-format '#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}} - #{pane_current_command}'

##############
#  BINDINGS  #
##############
# pass keys to programs
set-option -gw xterm-keys on

# clear history
# bind -n C-l send-keys C-l \; clear-history

# reload tmux config
bind-key -N "Reload config" C-x source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded ~/.config/tmux/tmux.conf"

# kill session / window / panel
bind-key -N "Clear screen" C-e send-keys 'C-l'

bind-key C-t new-window
bind-key -N "Kill pane" C-q kill-pane
bind -N "Kill session (confirm)" Q confirm kill-session
bind-key -N "Zoom pane" C-z resize-pane -Z


# rename session / window / panel
bind-key -N "Rename session" C-r command-prompt -p "Rename session:" -I '#S' 'rename-session %1'
bind-key -N "Rename window"    r command-prompt -p "Rename window:"  -I '#W' 'rename-window %1'
bind-key -N "Rename pane"      R command-prompt -p "Rename pane:"    -I '#T' 'rename-pane %1'

# create new panes and windows
bind-key -N "Split right"               C-v split-window -h -c "#{pane_current_path}"
bind-key -N "Split right"                 v split-window -h -c "#{pane_current_path}"
bind-key -N "Split below"               C-s split-window -v -c "#{pane_current_path}"
bind-key -N "Split below"                 s split-window -v -c "#{pane_current_path}"
bind-key -N "New window after this one" C-t new-window   -a -c "#{pane_current_path}"
bind-key -N "New window at the end"       t new-window

# one persistent shell popup per pane, toggled with the same key
bind-key -N "Toggle pane shell popup" -n M-T if-shell -F '#{m:popup-*,#{session_name}}' \
  'detach-client' \
  'run-shell "tmux has-session -t popup-#{pane_id} 2>/dev/null || { tmux new-session -d -s popup-#{pane_id} -c \"#{pane_current_path}\"; tmux set -t popup-#{pane_id} status off; }"; run-shell -C "display-popup -E -w 80% -h 80% \"env -u TMUX tmux attach -t popup-#{pane_id}\""'
set-hook -g pane-exited 'run-shell -b "tmux kill-session -t popup-#{hook_pane} 2>/dev/null"'
# unbind '"'
# unbind %

# smart pane switching with awareness of vim splits
# makes ctrl-j and ctrl-k navigate fzf search results when fzf active in pane
# providing the same behavior as ctrl-j and ctrl-k when navigating ctrl-p
# results inside vim.

IS_VIM="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
IS_FZF="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

# switch panes
bind-key -N "Go to pane left"  -n C-h                   if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-h" "select-pane -L"
bind-key -N "Go to pane below" -n C-j                   if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-j" "select-pane -D"
bind-key -N "Go to pane above" -n C-k                   if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-k" "select-pane -U"
bind-key -N "Go to pane right" -n C-l                   if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-l" "select-pane -R"

# # switch panes (copy-mode)
bind-key -N "Go to pane left"  -T copy-mode-vi C-h      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-h" "select-pane -L"
bind-key -N "Go to pane below" -T copy-mode-vi C-j      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-j" "select-pane -D"
bind-key -N "Go to pane above" -T copy-mode-vi C-k      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-k" "select-pane -U"
bind-key -N "Go to pane right" -T copy-mode-vi C-l      if-shell "${IS_VIM} || ${IS_FZF}" "send-keys C-l" "select-pane -R"

bind-key -N "Shrink pane width"  -T copy-mode-vi M-h resize-pane -L 1
bind-key -N "Grow pane height"   -T copy-mode-vi M-j resize-pane -D 1
bind-key -N "Shrink pane height" -T copy-mode-vi M-k resize-pane -U 1
bind-key -N "Grow pane width"    -T copy-mode-vi M-l resize-pane -R 1

# # resize panes
# bind-key -r , resize-pane -L 5
# bind-key -r < resize-pane -R 5
# bind-key -r > resize-pane -D 5
# bind-key -r . resize-pane -U 5

# spread panes out evenly
bind-key -N "Spread panes evenly" = select-layout -E

# change split direction
bind-key -N "Put pane beside the previous one" V move-pane -h -t '.-'
bind-key S move-pane -v -t '.-'

## Join windows
bind-key -N "Join pane from window…" j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key -N "Send pane to window…"   m command-prompt -p "send pane to:"  "join-pane -t '%%'"
## move pane to window
bind-key b break-pane
bind-key -N "Choose session or window" T choose-tree -swZ

# rotate panes
# bind-key C-r rotate-window

# swap panes
# bind-key -r H swap-pane -L
# bind-key -r J swap-pane -D
# bind-key -r K swap-pane -U
# bind-key -r L swap-pane -R

# swap windows
# bind-key -r <   swap-window -s -1 \; previous-window
# bind-key -r >   swap-window -s +1 \; next-window

# swap marked
bind-key -N "Swap pane with marked pane"     M-p swap-pane   \; select-pane -M
bind-key -N "Swap window with marked window" M-w swap-window \; select-pane -M

# switch windows
bind-key p previous-window
bind-key -N "Next window" n next-window

# control arrow to switch windows
bind-key -N "Previous window" -n C-Left previous-window
bind-key -N "Next window"     -n C-Right next-window

# Move window to the left or right (a window is just a tab)
bind-key -N "Move window left"  -n C-S-Left swap-window -t -1 \;  previous-window
bind-key -N "Move window right" -n C-S-Right swap-window -t +1 \; next-window

# save buffer to file
bind-key -N "Save pane history to file" M-s command-prompt -p 'Save history to filename:' -I '~/.tmux_history' 'capture-pane -S - -E - ; save-buffer %1 ; delete-buffer'

# display panes
bind-key -N "Show pane numbers" C-d display-panes

# toggle status bar
bind-key -N "Toggle status bar" B set-option status

# toggle synchronize
bind-key -N "Toggle typing into all panes" ^ set-window-option synchronize-panes

bind -N "Last window"  ^A last-window
bind -N "List windows" ^W list-windows
# bind d break-pane # breaks split into new tab
bind -N "Toggle typing into all panes" * setw synchronize-panes
bind -N "Choose window"                '"' choose-window
bind -N "Swap pane with next"          x swap-pane -D
bind -N "Bring pane into this window"  b choose-tree 'break-pane -as "%%"' # bring pane to current window

bind -N "New or attach session" S command-prompt -p "New Session:" "new-session -A -s '%%'"

# fzf bindings
# kill session
bind -N "Kill session (fzf)" K display-popup -E  "tmux list-sessions | grep -v \"^$(tmux display-message -p '#S')\" | fzf | sed -E 's/:.*$//' | xargs tmux kill-session -t"
# switch session
bind -N "Switch session (fzf)" . display-popup -E  "tmux list-sessions | grep -v \"^$(tmux display-message -p '#S')\" | fzf | sed -E 's/:.*$//' | xargs tmux switch-client -t"
# move window to session
bind -N "Move window to session (fzf)" M display-popup -E  "tmux list-sessions | grep -v \"^$(tmux display-message -p '#S')\" | fzf | sed -E 's/:.*$//' | xargs tmux move-window -d -s ${session}:${i} -t"

# move window to new session and switch
bind-key -N "Move window to new session" N command-prompt -p "New session name: " \
  "run-shell 'tmux new-session -d -s \"%1\" ; \
              tmux move-window -s \"#{session_name}:#{window_index}\" -t \"%1\" ; \
              tmux kill-window -t \"%1:1\" ; \
              tmux switch-client -t \"%1\"'"

# Bind number keys to switch windows
bind -N "Go to window 1" 1 select-window -t :1
bind -N "Go to window 2" 2 select-window -t :2
bind -N "Go to window 3" 3 select-window -t :3
bind -N "Go to window 4" 4 select-window -t :4
bind -N "Go to window 5" 5 select-window -t :5
bind -N "Go to window 6" 6 select-window -t :6
bind -N "Go to window 7" 7 select-window -t :7
bind -N "Go to window 8" 8 select-window -t :8
bind -N "Go to window 9" 9 select-window -t :9

KEY_PICKER='tmux list-keys -N -P "prefix " -T prefix \; list-keys -N -P "root " -T root | fzf --reverse --prompt "key> " | awk -v prefix="$(tmux show-option -gv prefix)" "{ printf \"%s\", (\$1 == \"prefix\" ? prefix \" \" \$2 : \$2) }" | xargs -0 tmux set-option -g @picked_key'
# the popup only records the pick: keys sent while it is still open would go to the popup
bind-key -N "Search key bindings" / {
  set-option -gu @picked_key
  display-popup -E -w 80% -h 60% -T " key bindings " "${KEY_PICKER}"
  if-shell -F "#{@picked_key}" {
    run-shell -C "send-keys -K -c '#{client_name}' #{@picked_key}"
  }
}


###############
#  COPY MODE  #
###############

# set clipboard
set-option -g set-clipboard external

# copy and paste
bind-key -N "Copy mode"    C-y copy-mode
bind-key -N "Copy mode"      y copy-mode
bind-key -N "Paste buffer"   p paste-buffer

# copy mode bindings
bind-key -N "Start selection"   -T copy-mode-vi v                 send-keys -X begin-selection
bind-key -N "Copy selection"    -T copy-mode-vi y                 send-keys -X copy-pipe
bind-key -N "Toggle block selection" -T copy-mode-vi C-v          send-keys -X rectangle-toggle
bind-key -N "Clear selection"   -T copy-mode-vi Space             send-keys -X clear-selection
bind-key -N "Exit copy mode"    -T copy-mode-vi q                 send-keys -X cancel
bind-key -N "Copy and exit"     -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel
# bind-key -T copy-mode-vi Escape            if-shell -F '#{selection_present}' 'send-keys -X clear-selection' 'send-keys -X cancel'

# Stay in copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X copy-pipe-no-clear \; send-keys -X clear-selection

# scroll speed
bind-key -T copy-mode-vi WheelUpPane   send-keys -N 3 -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -N 3 -X scroll-down
bind-key -T copy-mode    WheelUpPane   send-keys -N 3 -X scroll-up
bind-key -T copy-mode    WheelDownPane send-keys -N 3 -X scroll-down


# recording  program output to a log
bind -N "Toggle logging pane to ~/<window>.log" P pipe-pane -o "cat >>~/#W.log" \; display "Toggled logging to ~/#W.log"

# URL Launcher
URL_PICKER='tmux capture-pane -J -p | grep -oE "https?://[^[:space:]<>()\"\`]+" | sed -E "s/[.,;:]+$//" | awk "!seen[\$0]++" | fzf-tmux -d20 --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open'
bind-key -N "Open URL from pane"    C-u run-shell -b "${URL_PICKER}"
bind-key -N "Open URL from pane" -n M-u run-shell -b "${URL_PICKER}"

####################
#  MOUSE BINDINGS  #
####################

bind-key -n DoubleClick1StatusLeft switch-client -n


