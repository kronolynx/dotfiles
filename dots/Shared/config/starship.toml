palette = "catppuccin_frappe"
right_format = """$kubernetes"""

[fill]
symbol = ' '

[git_branch]
format = 'on [$symbol$branch(:$remote_branch)]($style) '
style = 'bold teal'

[git_state]
cherry_pick = '[🍒 PICKING](bold red)'
style = 'bold peach'

[git_status]
style = 'bold mauve'

[cmd_duration]
style = 'bold pink'

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[time]
disabled = false
style = "bold sapphire"
time_format = "%T"
format = "[$time]($style) "

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style)'
symbol = '☸ '
style = 'surface2'

[status]
style = "blue"
symbol = "💣"
format = "[$symbol]($style) "
#disabled = true

[directory]
fish_style_pwd_dir_length = 1
style = "blue"

[python]
symbol = "🐍 "

[java]
#symbol = "🗡  "
symbol = "⚔️ "
format = "[${symbol}(${version} )]($style)"
style = "bold sapphire"

[docker_context]
format = "[🐋 $context](surface2 bold)"

[scala]
symbol = "⚔️ "
format = "[${symbol}(${version} )]($style)"
disabled = true

[aws]
disabled = true

[nodejs]
detect_extensions = [ ]
detect_files = ["package.json", ".node-version"]

[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"


